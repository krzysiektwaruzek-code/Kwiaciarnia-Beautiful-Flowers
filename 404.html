<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">

  <title>Nie znaleziono strony – Kwiaciarnia Beautiful Flowers</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1f18">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; padding: 2rem var(--gutter); text-align: center; color: var(--c-text-on-dark);
      background: radial-gradient(55% 70% at 88% 8%, rgba(196, 98, 109, .32), transparent 62%), radial-gradient(50% 60% at 4% 100%, rgba(91, 127, 102, .38), transparent 66%), linear-gradient(180deg, var(--c-forest-900), var(--c-forest-800)); }
    .nf__code { font-family: var(--font-display); font-size: clamp(5rem, 22vw, 11rem); line-height: 1; color: var(--c-rose-300); letter-spacing: -.04em; }
    .nf__title { margin-top: .5rem; font-family: var(--font-display); font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 420; }
    .nf__text { margin: 1rem auto 2rem; max-width: 28rem; color: var(--c-muted-on-dark); }
  </style>
</head>
<body>
  <main class="nf" id="main">
    <div>
      <p class="nf__code" aria-hidden="true">404</p>
      <h1 class="nf__title">Nie znaleziono strony</h1>
      <p class="nf__text">Adres, który wpisałeś, nie istnieje lub został przeniesiony.</p>
      <a class="btn btn--light" href="/">Wróć na stronę główną</a>
    </div>
  </main>
</body>
